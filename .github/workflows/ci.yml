name: Frontend CI

on:
    push:
        branches:
            - main

jobs:
    test:
        runs-on: windows-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build React
              run: npm run build

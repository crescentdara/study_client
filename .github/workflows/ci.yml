name: Frontend CI/CD

on:
    push:
        branches:
            - main

jobs:
    frontend-build:
        runs-on: windows-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build frontend
              run: npm run build

            - name: Upload frontend artifact
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-build
                  path: dist
                  retention-days: 7

    frontend-deploy-test:
        needs: frontend-build
        runs-on: [self-hosted, frontend]

        steps:
            - name: Frontend Runner Test
              run: |
                  echo "Frontend Runner OK"
                  hostname
                  whoami
                  pwd

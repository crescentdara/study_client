# GitHub Actions 화면에 표시될 Workflow 이름
name: Frontend CI/CD

# 언제 이 Workflow를 실행할지 정의
on:
    push:
        # main 브랜치에 push가 발생했을 때 실행
        branches:
            - main

jobs:
    # =========================================================
    # 1. 프론트엔드 CI 빌드
    # =========================================================
    #
    # 역할:
    # - GitHub가 제공하는 임시 Windows 서버에서 실행
    # - 소스코드 다운로드
    # - Node.js 설치
    # - npm 의존성 설치
    # - Vite 빌드 수행
    # - 생성된 dist 폴더를 Artifact로 저장
    #
    # 여기서는 실제 운영 서버에 파일을 복사하지 않음
    # =========================================================
    frontend-build:
        # GitHub가 제공하는 Windows Runner 사용
        # 실제 우리 배포 서버가 아니라 GitHub의 임시 서버임
        runs-on: windows-latest

        steps:
            # -----------------------------------------------------
            # GitHub Repository의 소스코드를 Runner에 다운로드
            # -----------------------------------------------------
            - name: Checkout source
              uses: actions/checkout@v4

            # -----------------------------------------------------
            # Node.js 설치
            #
            # 현재 프로젝트 빌드에 Node.js 20 사용
            #
            # cache: npm
            # → npm 패키지 캐시를 활용하여
            #   다음 빌드부터 npm ci 시간을 줄일 수 있음
            # -----------------------------------------------------
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            # -----------------------------------------------------
            # package-lock.json 기준으로 npm 패키지 설치
            #
            # npm install 대신 npm ci를 사용하는 이유:
            #
            # - package-lock.json을 정확히 따름
            # - CI 환경에서 재현성이 높음
            # - 기존 node_modules를 깨끗하게 설치
            #
            # package-lock.json이 반드시 Repository에 있어야 함
            # -----------------------------------------------------
            - name: Install dependencies
              run: npm ci

            # -----------------------------------------------------
            # Vite Production Build 실행
            #
            # package.json의 scripts에 보통 아래와 같이 설정됨
            #
            # "build": "vite build"
            #
            # 빌드 성공 시 프로젝트 루트에
            #
            # dist/
            #   index.html
            #   assets/
            #   ...
            #
            # 생성
            # -----------------------------------------------------
            - name: Build frontend
              run: npm run build

            # -----------------------------------------------------
            # 생성된 dist 폴더를 GitHub Actions Artifact로 저장
            #
            # 중요한 이유:
            #
            # frontend-build는 GitHub의 임시 서버에서 실행되고
            # frontend-deploy는 실제 우리 Windows 서버에서 실행됨
            #
            # 따라서 두 Runner 사이에서 dist를 직접 공유할 수 없음
            #
            # GitHub Artifact를 중간 전달 수단으로 사용
            #
            # 흐름:
            #
            # dist
            #   ↓
            # frontend-build Artifact
            #   ↓
            # self-hosted Runner가 다운로드
            #
            # retention-days: 7
            # → Artifact를 GitHub에 7일간 보관
            # -----------------------------------------------------
            - name: Upload frontend artifact
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-build
                  path: dist
                  retention-days: 7

    # =========================================================
    # 2. 프론트엔드 실제 배포
    # =========================================================
    #
    # 이 Job부터는 GitHub 서버가 아니라
    # 실제 Windows 배포 서버에서 실행됨
    #
    # 현재 배포 서버에 설치한 self-hosted Runner:
    #
    # C:\actions-runner-frontend
    #
    # Runner Label:
    #
    # frontend
    #
    # 실제 배포 대상:
    #
    # C:\perpur\front\dist
    #
    # =========================================================
    frontend-deploy:
        # -----------------------------------------------------
        # frontend-build가 성공한 뒤에만 실행
        #
        # frontend-build 실패
        # → frontend-deploy 실행 안 됨
        #
        # 따라서 빌드 실패한 파일이 운영 서버에
        # 배포되는 것을 막을 수 있음
        # -----------------------------------------------------
        needs: frontend-build

        # -----------------------------------------------------
        # 실제 Windows 배포 서버에 설치된
        # self-hosted Runner를 사용
        #
        # self-hosted
        # → GitHub 제공 Runner가 아닌 자체 서버
        #
        # frontend
        # → 우리가 프론트 Runner에 추가한 Label
        #
        # 따라서 백엔드 Runner가 이 Job을 가져가지 않고
        # frontend Runner만 이 Job을 처리
        # -----------------------------------------------------
        runs-on: [self-hosted, frontend]

        steps:
            # -----------------------------------------------------
            # CI 단계에서 저장한 frontend-build Artifact 다운로드
            #
            # 다운로드 위치:
            #
            # frontend-dist
            #
            # 실제 서버에서는 대략:
            #
            # C:\actions-runner-frontend\
            #   _work\
            #     study_client\
            #       study_client\
            #         frontend-dist\
            #
            # 안에 index.html, assets 등이 생성됨
            #
            # 즉:
            #
            # frontend-dist\
            #   index.html
            #   assets\
            #   ...
            #
            # -----------------------------------------------------
            - name: Download frontend artifact
              uses: actions/download-artifact@v4
              with:
                  name: frontend-build
                  path: frontend-dist

            # -----------------------------------------------------
            # 실제 운영 경로로 파일 배포
            #
            # PowerShell을 사용
            # -----------------------------------------------------
            - name: Deploy frontend
              shell: powershell

              run: |

                  # =================================================
                  # 실제 프론트 운영 배포 경로
                  # =================================================
                  #
                  # 최종적으로 아래 구조가 됨
                  #
                  # C:\perpur\front\dist\
                  #   index.html
                  #   assets\
                  #   ...
                  #
                  # =================================================
                  $deployPath = "C:\perpur\front\dist"


                  Write-Host "===================================="
                  Write-Host "Frontend Deploy Start"
                  Write-Host "Target Path : $deployPath"
                  Write-Host "===================================="


                  # =================================================
                  # 배포 대상 폴더가 없는 경우 생성
                  #
                  # 일반적으로 이미 존재하겠지만
                  # 신규 서버에서도 Workflow가 동작할 수 있도록
                  # 방어적으로 작성
                  # =================================================
                  if (!(Test-Path $deployPath)) {

                      Write-Host "Deploy directory does not exist."
                      Write-Host "Creating deploy directory..."

                      New-Item `
                        -ItemType Directory `
                        -Path $deployPath `
                        -Force
                  }


                  # =================================================
                  # 기존 프론트 파일 삭제
                  #
                  # C:\perpur\front\dist 폴더 자체는 유지하고
                  # 그 안의 내용만 삭제
                  #
                  # 예:
                  #
                  # dist
                  # ├─ index.html        ← 삭제
                  # ├─ assets            ← 삭제
                  # └─ 기타 파일         ← 삭제
                  #
                  # dist 폴더 자체는 삭제하지 않음
                  # =================================================
                  Write-Host ""
                  Write-Host "Removing old frontend files..."

                  Get-ChildItem $deployPath -Force |
                      Remove-Item -Recurse -Force


                  # =================================================
                  # 새로 빌드한 파일 복사
                  #
                  # frontend-dist는
                  # actions/download-artifact가 다운로드한 경로
                  #
                  # .\frontend-dist\*
                  #
                  # 의 내용을
                  #
                  # C:\perpur\front\dist
                  #
                  # 로 복사
                  #
                  # 중요:
                  #
                  # frontend-dist 폴더 자체를 복사하는 게 아니라
                  # 그 안의 내용(*)을 복사함
                  #
                  # 따라서 아래처럼 됨
                  #
                  # 정상:
                  # C:\perpur\front\dist\index.html
                  # C:\perpur\front\dist\assets
                  #
                  # 잘못된 형태:
                  # C:\perpur\front\dist\dist\index.html
                  #
                  # =================================================
                  Write-Host ""
                  Write-Host "Copying new frontend files..."

                  Copy-Item `
                    -Path ".\frontend-dist\*" `
                    -Destination $deployPath `
                    -Recurse `
                    -Force


                  # =================================================
                  # 배포 완료 로그
                  # =================================================
                  Write-Host ""
                  Write-Host "===================================="
                  Write-Host "Frontend Deploy Complete"
                  Write-Host "===================================="


                  # =================================================
                  # 실제 배포된 파일 목록 출력
                  #
                  # GitHub Actions 로그에서
                  # index.html, assets 등이 실제 복사되었는지
                  # 확인하기 위한 용도
                  # =================================================
                  Write-Host ""
                  Write-Host "Deployed files:"

                  Get-ChildItem $deployPath
